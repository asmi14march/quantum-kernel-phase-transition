[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qkpt"
version = "0.1.0"
description = "Quantum kernel learning for detecting phase transitions in classical and quantum spin systems"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Aman Mahnoori" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "qiskit>=1.3",
    "numba>=0.58",
]

[project.optional-dependencies]
qml = ["qiskit-machine-learning>=0.8"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
